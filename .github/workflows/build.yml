name: Build Fine3399 OpenWrt

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt tag or branch to build"
        required: true
        default: "v24.10.8"
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 2 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || 'v24.10.8' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY}"
          sudo apt-get -y purge '^dotnet-.*' '^llvm-.*' '^temurin-.*' \
                      '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable \
                      firefox powershell mono-devel || true
          sudo apt-get -y autoremove --purge || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "=== after ==="; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-pyelftools python3-pkg-resources \
            rsync swig unzip zlib1g-dev file wget subversion \
            device-tree-compiler quilt bc time libelf-dev zstd cpio
          python3 -c "import elftools; print('pyelftools', elftools.__version__)"

      - name: Clone OpenWrt (${{ env.OPENWRT_REF }})
        run: |
          git clone --depth 1 --branch "$OPENWRT_REF" "$OPENWRT_REPO" openwrt
          git -C openwrt log -1 --oneline

      - name: Apply Fine3399 support
        run: |
          ./scripts/apply.sh openwrt

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp configs/fine3399.config openwrt/.config
          cd openwrt
          make defconfig
          echo "=== selected device ==="
          grep -E 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_rumu3f_fine3399|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE' .config
          test "$(grep -c '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_rumu3f_fine3399=y$' .config)" = 1
          echo "=== u-boot variant ==="
          grep -n 'fine3399-rk3399' package/boot/uboot-rockchip/Makefile

      - name: Download sources
        run: |
          cd openwrt
          make download -j"$(nproc)" || make download -j1 V=s

      - name: Build firmware
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Verify U-Boot LPDDR4 config
        run: |
          echo "=== u-boot build dirs ==="
          ls -d openwrt/build_dir/target-*/u-boot-*/ 2>/dev/null || true
          cfg=$(ls -d openwrt/build_dir/target-aarch64_cortex-a53_musl/u-boot-*/.config 2>/dev/null | head -1)
          test -n "$cfg" || { echo "ERROR: u-boot .config not found under target-aarch64_cortex-a53_musl"; exit 1; }
          echo "=== using $cfg ==="
          grep -nE 'CONFIG_(RAM_[A-Za-z0-9_]*|BAUDRATE|TPL_|SPL_)' "$cfg" || true
          grep -qE '^CONFIG_RAM_ROCKCHIP_LPDDR4=y$' "$cfg" || {
            echo "ERROR: CONFIG_RAM_ROCKCHIP_LPDDR4 not enabled in $cfg"
            exit 1
          }
          grep -qE '^CONFIG_BAUDRATE=115200$' "$cfg" || {
            echo "ERROR: CONFIG_BAUDRATE is not 115200 in $cfg"
            exit 1
          }
          echo "u-boot LPDDR4 config OK"

      - name: Verify console baud
        run: |
          cd openwrt/bin/targets/rockchip/armv8
          img=$(ls *sysupgrade.img.gz | head -1)
          echo "checking $img for the console rate baked into boot.scr / U-Boot env"
          zcat "$img" | grep -abo 'console=ttyS2,115200' | head -3 || true
          if zcat "$img" | grep -aq 'console=ttyS2,1500000'; then
            echo "ERROR: 1500000 console string still present in image"
            exit 1
          fi
          echo "console baud OK"

      - name: Show results
        run: |
          ls -lh openwrt/bin/targets/rockchip/armv8/
          cat openwrt/bin/targets/rockchip/armv8/sha256sums 2>/dev/null || true

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fine3399-openwrt-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            openwrt/bin/targets/rockchip/armv8/*.img.gz
            openwrt/bin/targets/rockchip/armv8/*.manifest
            openwrt/bin/targets/rockchip/armv8/sha256sums
            openwrt/bin/targets/rockchip/armv8/profiles.json

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          retention-days: 7
          path: openwrt/build.log
